# Data Lakehouse — Docker Compose (profiles)
#
# Uso:
#   make up-core        → Postgres + Kafka + MinIO
#   make up-cdc         → Kafka Connect + Debezium
#   make up-catalog     → Iceberg REST Catalog
#   make up             → core + cdc + catalog
#
# Orchestration: Airflow executa Silver/Gold/reconciliação sob demanda.
# Os profiles transform, serving e ai seguem no roadmap.

x-common-env: &common-env
  TZ: America/Sao_Paulo

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  profiles: ["orchestration"]
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-env
    TZ: America/Sao_Paulo
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__PARALLELISM: "2"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:-}@airflow-db:5432/airflow
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:-}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__API__BASE_URL: http://localhost:8081
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/auth/passwords.json
    AIRFLOW_ALERT_WEBHOOK_URL: ${AIRFLOW_ALERT_WEBHOOK_URL:-}
    PYTHONPATH: /opt/lakehouse
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_DB: ${POSTGRES_DB}
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    MINIO_ENDPOINT: http://minio:9000
    MINIO_DUCKDB_ENDPOINT: minio:9000
    MINIO_ROOT_USER: ${MINIO_ROOT_USER}
    MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    CATALOG_URI: http://iceberg-rest:8181
  volumes:
    - ./projects/finance/orchestration/airflow/dags:/opt/airflow/dags:ro,z
    - ./projects/finance:/opt/lakehouse/projects/finance:ro,z
    - airflow-logs:/opt/airflow/logs
    - airflow-auth:/opt/airflow/auth
    - airflow-dbt-target:/opt/lakehouse/projects/finance/transform/dbt_project/target
    - airflow-dbt-logs:/opt/lakehouse/projects/finance/transform/dbt_project/logs
  networks:
    - lakehouse-net

services:

  postgres:
    image: postgres:16-alpine
    profiles: ["core"]
    container_name: lakehouse-postgres
    environment:
      <<: *common-env
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=4
      - -c
      - max_wal_senders=4
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./projects/finance/infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro,Z
    networks:
      - lakehouse-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.9.1
    profiles: ["core"]
    container_name: lakehouse-kafka
    user: root
    environment:
      <<: *common-env
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CONNECT_PLUGIN_PATH: '/usr/share/java,/usr/share/confluent-hub-components'
    ports:
      - "9092:9092"
      - "9094:9094"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - lakehouse-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 40s

  minio:
    image: minio/minio:latest
    profiles: ["core"]
    container_name: lakehouse-minio
    command: server /data --console-address ":9001"
    environment:
      <<: *common-env
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - lakehouse-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    profiles: ["core"]
    container_name: lakehouse-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command: >
      -c "set -e;
          mc alias set lakehouse http://minio:9000 \"${MINIO_ROOT_USER}\" \"${MINIO_ROOT_PASSWORD}\";
          mc mb --ignore-existing lakehouse/bronze;
          mc mb --ignore-existing lakehouse/silver;
          mc mb --ignore-existing lakehouse/gold;
          mc mb --ignore-existing lakehouse/warehouse;
          echo 'Buckets criados com sucesso: bronze, silver, gold, warehouse';"
    environment:
      <<: *common-env
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./infra/minio/create-buckets.sh:/etc/minio-init/create-buckets.sh:ro,Z
    networks:
      - lakehouse-net

  aviation-collector:
    build:
      context: .
      dockerfile: projects/aviation/collector/Dockerfile
    profiles: ["aviation"]
    container_name: lakehouse-aviation-collector
    environment:
      <<: *common-env
      PYTHONUNBUFFERED: "1"
      OPENSKY_CLIENT_ID: ${OPENSKY_CLIENT_ID:-}
      OPENSKY_CLIENT_SECRET: ${OPENSKY_CLIENT_SECRET:-}
      AVIATION_BBOX_LAMIN: ${AVIATION_BBOX_LAMIN:-}
      AVIATION_BBOX_LOMIN: ${AVIATION_BBOX_LOMIN:-}
      AVIATION_BBOX_LAMAX: ${AVIATION_BBOX_LAMAX:-}
      AVIATION_BBOX_LOMAX: ${AVIATION_BBOX_LOMAX:-}
      AVIATION_POLL_INTERVAL_SECONDS: ${AVIATION_POLL_INTERVAL_SECONDS:-60}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_BRONZE: ${MINIO_BUCKET_BRONZE:-bronze}
    depends_on:
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 45s
    networks:
      - lakehouse-net

  # PROFILE cdc — Kafka Connect + Debezium
  kafka-connect:
    build:
      context: ./docker/kafka-connect
    profiles: ["cdc"]
    container_name: lakehouse-kafka-connect
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      <<: *common-env
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: ${CONNECT_GROUP_ID}
      CONFIG_STORAGE_TOPIC: _connect_configs
      OFFSET_STORAGE_TOPIC: _connect_offsets
      STATUS_STORAGE_TOPIC: _connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
    ports:
      - "${CONNECT_REST_PORT:-8083}:8083"
    volumes:
      - ./projects/finance/infra/kafka-connectors:/kafka/connectors:ro,Z
    networks:
      - lakehouse-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/"]
      interval: 15s
      timeout: 10s
      retries: 5

  # PROFILE: catalog — Iceberg REST Catalog
  iceberg-rest:
    image: tabulario/iceberg-rest:1.6.0
    profiles: ["catalog"]
    container_name: lakehouse-iceberg-rest
    depends_on:
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      <<: *common-env
      CATALOG_WAREHOUSE: ${CATALOG_WAREHOUSE}
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_CATALOG__IMPL: org.apache.iceberg.jdbc.JdbcCatalog
      CATALOG_URI: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      CATALOG_JDBC_USER: ${POSTGRES_USER}
      CATALOG_JDBC_PASSWORD: ${POSTGRES_PASSWORD}
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_REGION: us-east-1
    ports:
      - "8181:8181"
    networks:
      - lakehouse-net
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/8181' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PROFILE: trino — Trino Query Engine for Iceberg
  trino:
    image: trinodb/trino:435
    profiles: ["trino"]
    container_name: lakehouse-trino
    depends_on:
      iceberg-rest:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      <<: *common-env
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "8080:8080"
    volumes:
      - ./infra/trino/catalog:/etc/trino/catalog:ro,Z
    networks:
      - lakehouse-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/info"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PROFILE: orchestration — Airflow 3 com LocalExecutor.
  airflow-db:
    image: postgres:16-alpine
    profiles: ["orchestration"]
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:-}
      POSTGRES_DB: airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    networks:
      - lakehouse-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-permissions:
    image: postgres:16-alpine
    profiles: ["orchestration"]
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown -R ${AIRFLOW_UID:-50000}:0 /auth /logs /dbt-target /dbt-logs"]
    volumes:
      - airflow-auth:/auth
      - airflow-logs:/logs
      - airflow-dbt-target:/dbt-target
      - airflow-dbt-logs:/dbt-logs
    networks:
      - lakehouse-net

  airflow-init:
    <<: *airflow-common
    command: db migrate
    depends_on:
      airflow-db:
        condition: service_healthy
      airflow-permissions:
        condition: service_completed_successfully

  airflow-api-server:
    <<: *airflow-common
    command: api-server
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 15s
      timeout: 10s
      retries: 5

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-api-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      iceberg-rest:
        condition: service_healthy

  # PROFILES: transform, serving, ai
  # Serão implementados nas fases seguintes. Stubs abaixo para referência.
  # transform (FASE 3):  DuckDB + dbt  → profile "transform"
  # serving (FASE 6):  FastAPI + BI     → profile "serving"
  # ai (FASE 6):       Ollama + RAG     → profile "ai"

# Rede e volumes compartilhados

networks:
  lakehouse-net:
    name: lakehouse-net
    driver: bridge

volumes:
  postgres-data:
    name: lakehouse-postgres-data
  kafka-data:
    name: lakehouse-kafka-data
  minio-data:
    name: lakehouse-minio-data
  airflow-db-data:
    name: lakehouse-airflow-db-data
  airflow-logs:
    name: lakehouse-airflow-logs
  airflow-auth:
    name: lakehouse-airflow-auth
  airflow-dbt-target:
    name: lakehouse-airflow-dbt-target
  airflow-dbt-logs:
    name: lakehouse-airflow-dbt-logs
